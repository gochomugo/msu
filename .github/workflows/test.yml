name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reset-cache:
        description: 'Reset Homebrew cache'
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          # Add known hosts for common Git hosting services
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
          ssh-keyscan -H bitbucket.org >> ~/.ssh/known_hosts

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

      - name: Cache Homebrew packages
        if: inputs.reset-cache != true
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/.cache/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install dependencies
        run: make deps

      - name: Run tests
        env:
          TERM: xterm
        run: make test

  test-bash-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: bash:${{ matrix.bash }}
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /__w/msu/msu
      GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new
    strategy:
      fail-fast: false
      matrix:
        bash: ['4.0', '4.4', '5.0', '5.3']

    steps:
      - name: Install dependencies
        run: apk add --no-cache curl git make ca-certificates ncurses gettext openssh-client pandoc

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          # Add known hosts for common Git hosting services
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
          ssh-keyscan -H bitbucket.org >> ~/.ssh/known_hosts

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install bats-core
        uses: actions/checkout@v4
        with:
          repository: bats-core/bats-core
          path: bats-core

      - name: Print bash version
        run: echo "${BASH_VERSION}"

      - name: Run tests
        env:
          TERM: xterm
        run: make test.bash
